[project]
name = "gr8pc-root"
version = "0.0.0"
description = "Root"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    'gr8pc',
    'gr8gen',
]

[tool.uv.sources]
gr8pc = { workspace = true }
gr8gen = { workspace = true }


[dependency-groups]
dev = [
    "ruff>=0.14.10",
]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "grpcio-testing>=1.67.1",
]

[tool.uv.workspace]
members = ["packages/gr8pc", "packages/gr8gen"]

